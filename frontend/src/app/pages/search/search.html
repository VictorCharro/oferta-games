<div class="page-content">
  <div class="search-results" *ngIf="searched && !loading">
    <p class="results-count" *ngIf="results.length">{{ results.length }} resultado(s) para "{{ query }}"</p>
    <div class="games-grid" *ngIf="results.length">
      <app-game-card *ngFor="let game of results" [game]="game"></app-game-card>
    </div>
    <div class="no-results" *ngIf="!results.length">
      <p>Nenhum resultado para "{{ query }}"</p>
      <span>Tente outro nome ou verifique a ortografia.</span>
    </div>
  </div>

  <div class="games-grid loading-grid" *ngIf="loading">
    <div class="skeleton-card" *ngFor="let i of [1,2,3,4,5,6]"></div>
  </div>
</div>
