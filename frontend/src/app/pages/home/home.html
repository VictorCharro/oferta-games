<div class="page-content">

  <!-- Banner principal / carrossel -->
  <div class="banner" *ngIf="featuredDeals.length">
    <button class="banner-nav prev" (click)="prevFeatured()">‹</button>
    <div class="banner-viewport">
      <div class="banner-track" [style.transform]="'translateX(-' + (featuredIndex * 100) + '%)'">
        <a class="banner-slide" *ngFor="let f of featuredDeals" [routerLink]="['/jogo', f.slug]">
          <img class="banner-cover" [src]="f.coverUrl || 'no-cover.svg'" [alt]="f.title" />
          <div class="banner-info">
            <span class="banner-tag">Melhor oferta</span>
            <h1>{{ f.title }}</h1>
            <div class="banner-price">
              <span class="badge-discount">-{{ f.discountPct }}%</span>
              <span class="price-current">{{ formatPrice(f.price) }}</span>
              <span class="price-original">{{ formatPrice(f.regularPrice) }}</span>
            </div>
            <p class="banner-store">{{ f.storeName }}</p>
          </div>
        </a>
      </div>
    </div>
    <button class="banner-nav next" (click)="nextFeatured()">›</button>
    <div class="banner-dots">
      <span *ngFor="let d of featuredDeals; let i = index"
            class="dot" [class.active]="i === featuredIndex"
            (click)="goToFeatured(i)"></span>
    </div>
  </div>

  <!-- Favoritos -->
  <section class="section" *ngIf="favoritesDeals.length">
    <div class="section-header">
      <h2>Favoritos</h2>
      <a routerLink="/favoritos">Ver todos</a>
    </div>
    <app-deals-carousel [deals]="favoritesDeals"></app-deals-carousel>
  </section>

  <!-- Grátis da semana -->
  <section class="section" *ngIf="loading || freeWeek.length">
    <div class="section-header">
      <h2>Grátis da semana</h2>
      <a routerLink="/gratuitos">Ver todos</a>
    </div>
    <div class="deals-row" *ngIf="loading">
      <div class="deal-card skeleton" *ngFor="let i of [1,2,3,4,5,6,7,8]"></div>
    </div>
    <app-deals-carousel *ngIf="!loading" [deals]="freeWeek"></app-deals-carousel>
  </section>

  <!-- Maiores descontos (jogos) -->
  <section class="section" *ngIf="topDiscountGames.length">
    <div class="section-header">
      <h2>Maiores descontos em Jogos</h2>
      <a routerLink="/catalogo">Ver todos</a>
    </div>
    <app-deals-carousel [deals]="topDiscountGames"></app-deals-carousel>
  </section>

  <!-- Maiores descontos (DLCs) -->
  <section class="section" *ngIf="topDiscountDlcs.length">
    <div class="section-header">
      <h2>Maiores descontos em DLCs</h2>
      <a routerLink="/catalogo">Ver todos</a>
    </div>
    <app-deals-carousel [deals]="topDiscountDlcs"></app-deals-carousel>
  </section>

</div>
