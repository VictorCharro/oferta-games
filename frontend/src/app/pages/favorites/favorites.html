<div class="page-content">
  <div class="page-header">
    <h1>Jogos Monitorados</h1>
    <p>Jogos que você marcou para acompanhar preços</p>
  </div>

  <div class="games-grid" *ngIf="!loading && games.length">
    <app-monitored-game-card *ngFor="let game of games" [game]="game"></app-monitored-game-card>
  </div>

  <div class="games-grid" *ngIf="loading">
    <div class="skeleton-card" *ngFor="let i of [1,2,3,4,5,6]"></div>
  </div>

  <div class="empty-state" *ngIf="!loading && !games.length">
    <img src="jogos-monitorados-modo-escuro.png" class="empty-icon" alt="" />
    <h3>Nenhum jogo monitorado ainda</h3>
    <p>Clique no coração dos jogos no <a routerLink="/catalogo">catálogo</a> para acompanhá-los aqui.</p>
  </div>
</div>
