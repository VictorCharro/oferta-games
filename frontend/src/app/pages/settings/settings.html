<div class="page-content">
  <div class="settings-page">
    <h1>Configurações</h1>

    <div class="settings-card">
      <h2>Alterar senha</h2>

      <!-- campos-isca invisíveis para absorver o autofill do navegador -->
      <input type="text" style="display:none" autocomplete="username" />
      <input type="password" style="display:none" autocomplete="new-password" />

      <div class="field">
        <label>Senha atual</label>
        <input type="password" name="currentPassword" autocomplete="off" readonly #curPwd
          (focus)="curPwd.removeAttribute('readonly')" [(ngModel)]="currentPassword" placeholder="••••••••" />
      </div>
      <div class="field">
        <label>Nova senha</label>
        <input type="password" name="newPassword" autocomplete="off" readonly #newPwd
          (focus)="newPwd.removeAttribute('readonly')" [(ngModel)]="newPassword" placeholder="••••••••" />
      </div>
      <div class="field">
        <label>Confirmar nova senha</label>
        <input type="password" name="confirmPassword" autocomplete="off" readonly #confirmPwd
          (focus)="confirmPwd.removeAttribute('readonly')" [(ngModel)]="confirmPassword" placeholder="••••••••" />
      </div>
      <p class="msg-success" *ngIf="success">{{ success }}</p>
      <p class="msg-error" *ngIf="error">{{ error }}</p>
      <button class="btn-primary" (click)="changePassword()" [disabled]="saving">
        {{ saving ? 'Salvando...' : 'Alterar senha' }}
      </button>
    </div>

    <div class="settings-card danger-zone">
      <h2>Sessão</h2>
      <p>Encerrar sua sessão em todos os dispositivos.</p>
      <button class="btn-danger" (click)="logout()">Sair da conta</button>
    </div>
  </div>
</div>
