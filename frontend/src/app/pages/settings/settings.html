<div class="page-content">
  <div class="settings-page">
    <h1>Configurações</h1>

    <div class="settings-card">
      <h2>Alterar senha</h2>
      <div class="field">
        <label>Nova senha</label>
        <input type="password" [(ngModel)]="newPassword" placeholder="••••••••" />
      </div>
      <div class="field">
        <label>Confirmar nova senha</label>
        <input type="password" [(ngModel)]="confirmPassword" placeholder="••••••••" />
      </div>
      <p class="msg-success" *ngIf="success">{{ success }}</p>
      <p class="msg-error" *ngIf="error">{{ error }}</p>
      <button class="btn-primary" (click)="changePassword()" [disabled]="saving">
        {{ saving ? 'Salvando...' : 'Alterar senha' }}
      </button>
    </div>

    <div class="settings-card danger-zone">
      <h2>Sessão</h2>
      <p>Encerrar sua sessão em todos os dispositivos.</p>
      <button class="btn-danger" (click)="logout()">Sair da conta</button>
    </div>
  </div>
</div>
