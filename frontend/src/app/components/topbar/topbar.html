<header class="topbar">
  <div class="search-wrapper">
    <img class="search-icon" src="pesquisar.png" alt="Pesquisar" />
    <input
      type="text"
      placeholder="Pesquisar jogos, lojas, categorias..."
      [(ngModel)]="searchQuery"
      (keydown)="onSearch($event)"
      class="search-input"
    />
  </div>

  <div class="topbar-actions">
    <button class="action-btn theme-btn" (click)="theme.toggle()" [title]="theme.isDark() ? 'Modo claro' : 'Modo escuro'">
      <img [src]="theme.isDark() ? 'sol-tema-claro.png' : 'lua-tema-escuro.png'" style="width:20px;height:20px;object-fit:contain;" />
    </button>

    <!-- Logado: avatar com dropdown -->
    <div class="user-menu" *ngIf="auth.isLoggedIn">
      <div class="avatar" (click)="toggleDropdown()">
        <div class="avatar-circle">{{ auth.displayName.charAt(0).toUpperCase() }}</div>
        <div class="avatar-info">
          <span class="avatar-name">{{ auth.displayName }}</span>
          <span class="avatar-level">Nível 1</span>
        </div>
      </div>
      <div class="dropdown" *ngIf="dropdownOpen">
        <a routerLink="/perfil" class="dropdown-item" (click)="dropdownOpen = false">
          <img src="perfil.png" /> Perfil
        </a>
        <a routerLink="/configuracoes" class="dropdown-item" (click)="dropdownOpen = false">
          <img src="configuracoes.png" /> Configurações
        </a>
        <div class="dropdown-divider"></div>
        <button class="dropdown-item danger" (click)="logout()">
          <img src="logout.png" /> Sair
        </button>
      </div>
    </div>

    <!-- Não logado: botões de login/cadastro -->
    <div class="auth-buttons" *ngIf="!auth.isLoggedIn">
      <a routerLink="/login" class="btn-outline btn-sm">Entrar</a>
      <a routerLink="/login" [queryParams]="{mode: 'register'}" class="btn-primary btn-sm">Criar conta</a>
    </div>
  </div>
</header>
