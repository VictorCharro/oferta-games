<a class="game-card" [routerLink]="['/jogo', game.slug]">
  <div class="card-image">
    <img [src]="game.coverUrl || 'assets/no-cover.png'" [alt]="game.title" loading="lazy" />
    <span *ngIf="discount > 0" class="badge-discount">-{{ discount }}%</span>
    <button class="btn-favorite" (click)="toggleFavorite($event)" [class.active]="favorited">
      {{ favorited ? '❤️' : '🤍' }}
    </button>
  </div>
  <div class="card-body">
    <h3 class="card-title">{{ game.title }}</h3>
    <div class="card-price">
      <span class="price-current">{{ formatPrice(game.minPrice) }}</span>
    </div>
    <div *ngIf="storeName" class="card-store">{{ storeName }}</div>
  </div>
</a>
