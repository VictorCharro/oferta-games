<div class="carousel">
  <button class="carousel-nav prev" #prevBtn (click)="scroll(-1)">‹</button>
  <div class="deals-row" #row (scroll)="onScroll()">
    <a *ngFor="let deal of deals" class="deal-card" [routerLink]="['/jogo', deal.slug]">
      <div class="deal-cover">
        <img [src]="deal.coverUrl || 'no-cover.svg'" [alt]="deal.title" loading="lazy" decoding="async" (error)="capaIndisponivel($event)" />
        <span *ngIf="deal.discountPct > 0 && deal.discountPct < 100" class="badge-discount">-{{ deal.discountPct }}%</span>
        <span *ngIf="isDlc(deal)" class="badge-dlc">DLC</span>
      </div>
      <div class="deal-info">
        <p class="deal-title">{{ deal.title }}</p>
        <div class="deal-prices" *ngIf="deal.discountPct < 100; else freeLabel">
          <span class="price-current">{{ formatPrice(deal.price) }}</span>
          <span class="price-original" *ngIf="temPrecoAnterior(deal)">{{ formatPrice(deal.regularPrice) }}</span>
        </div>
        <ng-template #freeLabel><span class="price-current">Grátis</span></ng-template>
        <span *ngIf="deal.storeName" class="deal-store">
          <img class="store-logo" [src]="storeLogo(deal.storeName)" [alt]="deal.storeName" />
          <span>{{ deal.storeName }}</span>
        </span>
        <div *ngIf="deal.storeName" class="platform-list" aria-label="Plataformas">
          <span *ngFor="let platform of platforms(deal.storeName, deal.url)" class="platform-chip" [title]="platform.name">
            <img [src]="platform.logo" [alt]="platform.name" />
            <span>{{ platform.name }}</span>
          </span>
        </div>
      </div>
    </a>
  </div>
  <button class="carousel-nav next" #nextBtn (click)="scroll(1)">›</button>
</div>
