<aside class="sidebar">
  <a class="logo" routerLink="/">
    <img src="logo.png" class="logo-icon" alt="Oferta Games" />
    <span class="logo-text"><span class="logo-oferta">Oferta</span>Games</span>
  </a>

  <nav class="nav-section">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}" class="nav-item">
      <img class="nav-icon" src="home.png" alt="Início" /> Início
    </a>
    <a routerLink="/catalogo" routerLinkActive="active" class="nav-item">
      <img class="nav-icon" src="catalogo.png" alt="Catálogo" /> Catálogo
    </a>
    <a routerLink="/mais-vendidos" routerLinkActive="active" class="nav-item">
      <img class="nav-icon" src="mais-vendidos.png" alt="Mais Vendidos" /> Mais Vendidos
    </a>
    <a routerLink="/gratuitos" routerLinkActive="active" class="nav-item">
      <img class="nav-icon" src="gratuito.png" alt="Gratuitos" /> Gratuitos
    </a>
  </nav>

  <div class="nav-label">BIBLIOTECA</div>
  <nav class="nav-section">
    <a routerLink="/favoritos" routerLinkActive="active" class="nav-item">
      <img class="nav-icon" src="favorito.png" alt="Favoritos" /> Favoritos
    </a>
  </nav>

  <div class="nav-label">CONTA</div>
  <nav class="nav-section">
    <a class="nav-item"><img class="nav-icon" src="perfil.png" alt="Perfil" /> Perfil</a>
    <a class="nav-item"><img class="nav-icon" src="configuracoes.png" alt="Configurações" /> Configurações</a>
    <a class="nav-item"><img class="nav-icon" src="logout.png" alt="Sair" /> Sair</a>
  </nav>

  <div class="pro-card">
    <div class="pro-crown">👑 Oferta Games PRO</div>
    <p>Remova anúncios, tenha acesso a recursos exclusivos e apoie o projeto!</p>
    <button class="btn-pro">Seja PRO</button>
  </div>
</aside>
