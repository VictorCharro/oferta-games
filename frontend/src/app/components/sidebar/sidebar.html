<!-- So existe/e clicavel quando o drawer esta aberto (controlado por *ngIf, nao so opacidade),
     senao ficaria interceptando clique por cima da pagina mesmo fechado. -->
<div class="mobile-backdrop" *ngIf="menuMobile.isOpen()" (click)="menuMobile.close()"></div>

<aside class="sidebar" [class.open]="menuMobile.isOpen()">
  <div class="sidebar-header">
    <a class="logo" routerLink="/" (click)="menuMobile.close()">
      <img src="logo.png" class="logo-full" alt="Oferta Games" />
    </a>
    <button type="button" class="close-btn" (click)="menuMobile.close()" aria-label="Fechar menu">✕</button>
  </div>

  <nav class="nav-section" (click)="menuMobile.close()">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}" class="nav-item">
      <img class="nav-icon" src="home.png" alt="Início" /> Início
    </a>
    <a routerLink="/catalogo" routerLinkActive="active" class="nav-item">
      <img class="nav-icon" src="catalogo.png" alt="Catálogo" /> Catálogo
    </a>
    <a routerLink="/mais-vendidos" routerLinkActive="active" class="nav-item">
      <img class="nav-icon" src="mais-vendidos.png" alt="Mais Vendidos" /> Mais Vendidos
    </a>
    <a routerLink="/gratuitos" routerLinkActive="active" class="nav-item">
      <img class="nav-icon" src="gratuito.png" alt="Gratuitos" /> Gratuitos
    </a>
  </nav>

  <div class="nav-label">BIBLIOTECA</div>
  <nav class="nav-section" (click)="menuMobile.close()">
    <a routerLink="/monitorados" routerLinkActive="active" class="nav-item">
      <img class="nav-icon" src="jogos-monitorados-modo-escuro.png" alt="Jogos Monitorados" /> Jogos Monitorados
    </a>
  </nav>

  <!-- Links legais e Fale conosco no pe da sidebar (issue #18): precisam estar acessiveis de
       qualquer pagina, e o app nao tem rodape. O state leva a pagina atual pra mensagem de contato. -->
  <footer class="sidebar-legal" (click)="menuMobile.close()">
    <a class="contato" routerLink="/contato" [state]="{ de: router.url }">Fale conosco</a>
    <a routerLink="/termos">Termos</a>
    <span aria-hidden="true">·</span>
    <a routerLink="/privacidade">Privacidade</a>
  </footer>

</aside>
