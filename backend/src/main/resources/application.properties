spring.application.name=ofertagames-backend

# Database (Supabase PostgreSQL via PgBouncer transaction pooler)
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# PgBouncer (transaction mode) nao suporta prepared statements
spring.datasource.hikari.data-source-properties.prepareThreshold=0

# API Keys
itad.api.key=${ITAD_API_KEY}
sync.secret.key=${SYNC_SECRET_KEY}

# Server
server.port=${PORT:8080}

# CORS (production: URL do Vercel)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Actuator (health check para o keep-alive do GitHub Actions)
management.endpoints.web.exposure.include=health
