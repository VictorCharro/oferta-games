name: oferta-games

services:
  backend:
    build:
      context: ../../backend-java
    container_name: oferta-games-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 8080
      JAVA_OPTS: -Xms256m -Xmx1024m
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
