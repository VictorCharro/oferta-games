name: oferta-games

services:
  backend:
    build:
      context: ../../backend-java
    container_name: oferta-games-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 8080
      JAVA_OPTS: -Xms256m -Xmx1024m
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    container_name: oferta-games-caddy
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
