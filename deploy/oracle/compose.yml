name: oferta-games

services:
  # Postgres so pro catalogo (games/game_details/game_achievements/offers/price_history/
  # instant_gaming_catalog) - migrado do Supabase free (cota de 500MB estourando) porque essas
  # tabelas sao 90% do banco e nao tem FK com auth.users (nao guardam dado de usuario nenhum).
  # Auth, sessao e as tabelas ligadas a usuario (favoritos, perfil, avaliacoes) continuam no
  # Supabase - la o cascade delete de auth.users continua funcionando.
  # Sem "ports:" de proposito: so acessivel pela rede interna do compose (backend), nunca exposto
  # pro host nem pra internet.
  catalogo-db:
    image: postgres:17-alpine
    container_name: oferta-games-catalogo-db
    restart: unless-stopped
    # Docker limita /dev/shm a 64MB por padrao - pouco pra Postgres sob varias queries
    # concorrentes com hash/sort grandes (ex: /api/deals/top, que agrega o catalogo inteiro).
    # Ja causou "could not resize shared memory segment: No space left on device" sob carga real
    # (varias pessoas acessando ao mesmo tempo apos o site voltar do ar). 256MB da folga generosa
    # pro tamanho atual do catalogo (~430MB de dados).
    shm_size: '256mb'
    environment:
      POSTGRES_DB: catalogo
      POSTGRES_USER: catalogo
      POSTGRES_PASSWORD: ${CATALOGO_DB_PASSWORD}
    volumes:
      - catalogo_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalogo -d catalogo"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../../backend-java
    container_name: oferta-games-backend
    restart: unless-stopped
    # Tempo pro shutdown gracioso terminar (server.shutdown: graceful, teto de 20s no Spring)
    # antes do SIGKILL. Sem essa folga o Docker matava em 10s, cortando requisicao em andamento e
    # impedindo o @PreDestroy de devolver a trava de coleta.
    stop_grace_period: 30s
    depends_on:
      catalogo-db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PORT: 8080
      JAVA_OPTS: -Xms256m -Xmx1024m
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    container_name: oferta-games-caddy
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
  catalogo_db_data:
