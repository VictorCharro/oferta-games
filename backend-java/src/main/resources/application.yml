server:
  port: ${PORT:8080}

spring:
  application:
    name: oferta-games-backend

app:
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  sync:
    secret-key: ${SYNC_SECRET_KEY:}
    scheduler:
      enabled: ${APP_SYNC_SCHEDULER_ENABLED:false}
      price-delay-ms: ${APP_SYNC_SCHEDULER_PRICE_DELAY_MS:600000}
      price-initial-delay-ms: ${APP_SYNC_SCHEDULER_PRICE_INITIAL_DELAY_MS:60000}
      steam-delay-ms: ${APP_SYNC_SCHEDULER_STEAM_DELAY_MS:900000}
      steam-initial-delay-ms: ${APP_SYNC_SCHEDULER_STEAM_INITIAL_DELAY_MS:300000}
      steam-achievements-delay-ms: ${APP_SYNC_SCHEDULER_STEAM_ACHIEVEMENTS_DELAY_MS:1800000}
      steam-achievements-initial-delay-ms: ${APP_SYNC_SCHEDULER_STEAM_ACHIEVEMENTS_INITIAL_DELAY_MS:600000}
      detalhes-delay-ms: ${APP_SYNC_SCHEDULER_DETALHES_DELAY_MS:900000}
      detalhes-initial-delay-ms: ${APP_SYNC_SCHEDULER_DETALHES_INITIAL_DELAY_MS:420000}
      conquistas-catalogo-delay-ms: ${APP_SYNC_SCHEDULER_CONQUISTAS_CATALOGO_DELAY_MS:10800000}
      conquistas-catalogo-initial-delay-ms: ${APP_SYNC_SCHEDULER_CONQUISTAS_CATALOGO_INITIAL_DELAY_MS:540000}
  itad:
    api-key: ${ITAD_API_KEY:}
  steam:
    api-key: ${STEAM_WEB_API_KEY:}
    frontend-url: ${FRONTEND_URL:http://localhost:4200}
  xbox:
    app-key: ${XBL_APP_KEY:}
  # URL publica deste backend. Usada no retorno OpenID da Steam e nos <loc> do indice do
  # sitemap (que apontam pros sub-sitemaps servidos aqui, nao pro frontend). Precisa bater com o
  # dominio do `Sitemap:` em frontend/public/robots.txt.
  public-backend-url: ${PUBLIC_BACKEND_URL:}
  supabase:
    url: ${SUPABASE_URL:}
    anon-key: ${SUPABASE_ANON_KEY:}
