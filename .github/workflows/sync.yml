name: Sync Prices

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger sync endpoint
        run: |
          curl -X POST "${{ secrets.BACKEND_URL }}/api/sync" \
            -H "X-Sync-Key: ${{ secrets.SYNC_SECRET_KEY }}" \
            -f --retry 3 --retry-delay 10
