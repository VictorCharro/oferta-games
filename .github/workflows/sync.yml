name: Sync ITAD Prices

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Run paginated backend sync
        env:
          BACKEND_API_URL: ${{ secrets.BACKEND_API_URL }}
          SYNC_SECRET_KEY: ${{ secrets.SYNC_SECRET_KEY }}
        run: |
          set -euo pipefail
          page=0
          while true; do
            response="$(curl -fsS -X POST "$BACKEND_API_URL/api/sync?page=$page" -H "X-Sync-Key: $SYNC_SECRET_KEY")"
            echo "$response"
            has_more="$(echo "$response" | jq -r '.hasMore')"
            next_page="$(echo "$response" | jq -r '.nextPage // empty')"
            if [ "$has_more" != "true" ] || [ -z "$next_page" ]; then
              break
            fi
            page="$next_page"
          done
