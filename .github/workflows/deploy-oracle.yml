name: Deploy backend na Oracle

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]

concurrency:
  group: deploy-oracle-producao
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # workflow_dispatch e sempre manual (deploy explicito); workflow_run so segue se a CI
    # daquele push realmente passou. Sem isso, deploy do backend quebrado quando a CI falha.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout do commit testado pela CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # Sempre deploya quando chega aqui (nao tenta adivinhar "mudou backend?" comparando so o
      # ultimo commit) - um "git diff HEAD^ HEAD" ja causou um commit com mudanca real no
      # backend ficar sem deploy: a CI daquele commit falhou (nada rodou), e o commit seguinte
      # (so o fix da CI) nao tocava backend-java/, entao o diff dele sozinho dava "nao relevante"
      # mesmo com o commit anterior nao-deployado esperando. git pull --ff-only na VM ja e
      # idempotente/barato quando nao ha nada novo, entao nao ha custo real em sempre rodar.
      - name: Configurar chave SSH
        env:
          ORACLE_SSH_PRIVATE_KEY_B64: ${{ secrets.ORACLE_SSH_PRIVATE_KEY_B64 }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$ORACLE_SSH_PRIVATE_KEY_B64" | base64 -d > ~/.ssh/id_oracle
          chmod 600 ~/.ssh/id_oracle

      - name: Atualizar backend na VM
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          ssh -i ~/.ssh/id_oracle -o StrictHostKeyChecking=accept-new ubuntu@"$ORACLE_HOST" \
            'cd /opt/oferta-games && git pull --ff-only origin master && docker compose -f deploy/oracle/compose.yml up -d --build'
