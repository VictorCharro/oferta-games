name: Deploy backend na Oracle

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]

concurrency:
  group: deploy-oracle-producao
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # workflow_dispatch e sempre manual (deploy explicito); workflow_run so segue se a CI
    # daquele push realmente passou. Sem isso, deploy do backend quebrado quando a CI falha.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout do commit testado pela CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # A decisao de recriar o container e tomada NA VM, comparando o commit que esta deployado
      # com o que acabou de chegar (ver o script abaixo). Nao e o mesmo que "git diff HEAD^ HEAD",
      # que ja falhou aqui: a CI de um commit com mudanca de backend quebrou, o commit seguinte
      # (so o fix da CI) nao tocava backend-java/, e o diff dele sozinho dizia "nao relevante"
      # enquanto o backend anterior seguia sem deploy. Comparando com o que ESTA RODANDO isso nao
      # acontece - qualquer commit de backend ainda nao publicado entra na conta.
      - name: Configurar chave SSH
        env:
          ORACLE_SSH_PRIVATE_KEY_B64: ${{ secrets.ORACLE_SSH_PRIVATE_KEY_B64 }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$ORACLE_SSH_PRIVATE_KEY_B64" | base64 -d > ~/.ssh/id_oracle
          chmod 600 ~/.ssh/id_oracle

      - name: Atualizar backend na VM
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          # workflow_dispatch e deploy explicito: recria mesmo sem mudanca (serve pra destravar
          # alguma coisa na mao).
          FORCAR: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: |
          # O script vai pra VM como ARQUIVO e roda de la, nao por stdin do 'bash -s'. Com stdin,
          # qualquer comando que leia a entrada padrao (docker compose exec, por exemplo) engole o
          # resto do script: aconteceu de verdade em 12/09/2026 - o deploy parou logo depois do
          # reload do Caddy, nunca publicou o backend e mesmo assim saiu com sucesso.
          ssh -i ~/.ssh/id_oracle -o StrictHostKeyChecking=accept-new ubuntu@"$ORACLE_HOST" \
            'cat > /tmp/deploy-oferta-games.sh' <<'REMOTO'
          set -euo pipefail
          cd /opt/oferta-games

          # A referencia e o que ESTA PUBLICADO (marcador gravado no fim de um deploy bem
          # sucedido), nao o HEAD do checkout: o git pull pode ter trazido um commit de backend
          # que nunca virou imagem - foi o que aconteceu em 12/09/2026, quando um deploy falhou no
          # meio, deixou a VM no commit novo com a imagem velha, e o deploy seguinte comparou
          # HEAD-antes com HEAD-depois, viu "nada de backend mudou" e pulou. Sem marcador, trata
          # como primeiro deploy e publica.
          MARCADOR=.deployed-sha
          PUBLICADO=$(cat "$MARCADOR" 2>/dev/null || true)
          git pull --ff-only origin master
          DEPOIS=$(git rev-parse HEAD)
          ANTES=${PUBLICADO:-}

          # O proxy tem decisao propria, separada da do backend: mudar so o Caddyfile nao precisa
          # reiniciar a API, e vice-versa.
          if [ -z "$ANTES" ] || [ -n "$(git diff --name-only "$ANTES" "$DEPOIS" -- deploy/oracle/Caddyfile)" ]; then
            # Recria o container em vez de recarregar: o Caddyfile entra por bind mount de
            # ARQUIVO, que aponta pro inode. O git pull escreve um arquivo novo e renomeia, entao
            # o container continua vendo o antigo e um 'caddy reload' rele o arquivo velho - foi o
            # que aconteceu em 12/09/2026 (host com a config nova, container sem). Recriar custa
            # ~1s de indisponibilidade e so acontece quando o Caddyfile muda, que e raro. Os
            # certificados ficam no volume caddy_data, entao nada e reemitido.
            echo "Caddyfile mudou: recriando o Caddy."
            docker compose -f deploy/oracle/compose.yml up -d --force-recreate caddy
          fi

          # Recria o backend quando: foi pedido na mao, o container nao esta de pe, ou mudou algo
          # que entra na imagem/no servico.
          MOTIVO=""
          if [ "$FORCAR" = "1" ]; then
            MOTIVO="deploy manual"
          elif [ -z "$ANTES" ]; then
            MOTIVO="sem marcador do que esta publicado"
          elif [ -z "$(docker ps --filter name=^oferta-games-backend$ --filter status=running -q)" ]; then
            MOTIVO="container fora do ar"
          elif [ -n "$(git diff --name-only "$ANTES" "$DEPOIS" -- backend-java/ deploy/oracle/compose.yml)" ]; then
            MOTIVO="mudanca em backend-java/ ou compose.yml"
          fi

          if [ -z "$MOTIVO" ]; then
            echo "Backend inalterado entre $ANTES e $DEPOIS - container mantido no ar."
            echo "Reiniciar a API a cada push de frontend derruba o SSR da Vercel por alguns"
            echo "segundos e ainda mata a coleta em andamento, entao so se mexe quando precisa."
          else
            echo "Publicando backend ($MOTIVO)."
            # build separado do up: com a imagem inalterada o 'up -d' deixa o container em paz, e
            # o '--build' embutido recriava mesmo sem mudanca nenhuma.
            docker compose -f deploy/oracle/compose.yml build backend
            docker compose -f deploy/oracle/compose.yml up -d
            docker compose -f deploy/oracle/compose.yml ps
            # Cada build deixa a imagem anterior sem tag e mais cache de build: em 13/09/2026 eram
            # ~20 GB recuperaveis num disco de 48 GB (issue #29). Imagem sem uso sai sempre; cache
            # de build so o de mais de 72h, pra camada de dependencias do Maven continuar sendo
            # reaproveitada e o proximo build nao baixar tudo de novo.
            docker image prune -f
            docker builder prune -f --filter until=72h
          fi

          # So grava o marcador no fim: com set -e, qualquer falha acima deixa o marcador no
          # commit anterior e o proximo deploy refaz o trabalho em vez de pular achando que ja foi.
          echo "$DEPOIS" > "$MARCADOR"
          REMOTO

          ssh -i ~/.ssh/id_oracle ubuntu@"$ORACLE_HOST" "FORCAR=$FORCAR bash /tmp/deploy-oferta-games.sh"

      # Confere que a API voltou. Sem isso um deploy que fez so metade do trabalho sai verde - ja
      # aconteceu (ver o comentario do passo acima). Checa pela URL publica, entao valida o
      # caminho inteiro: Caddy, TLS e backend.
      - name: Verificar que a API respondeu
        run: |
          for i in $(seq 1 20); do
            if curl -fsS --max-time 10 https://api.163.176.220.243.sslip.io/actuator/health > /dev/null; then
              echo "API respondendo (tentativa $i)."
              exit 0
            fi
            sleep 5
          done
          echo "API nao respondeu em 100s apos o deploy."
          exit 1
